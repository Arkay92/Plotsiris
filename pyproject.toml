[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotsiris"
version = "2.5.0"
description = "Real-time global OSINT and reconnaissance dashboard in Python, Plotly, and Dash"
readme = "README.md"
authors = [{ name = "Plotsiris Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "dash>=2.16.0",
    "dash-bootstrap-components>=1.6.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "networkx>=3.0",
    "gunicorn>=21.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
plotsiris = "plotsiris.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plotsiris*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
